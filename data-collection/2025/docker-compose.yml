name: lupus-2025-local
services:
  n8n:
    build:
      context: ./n8n
      args:
        N8N_VERSION: ${N8N_VERSION:-2.39.8}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_LOCAL_PORT:-5679}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run Start-Local.ps1 or configure .env first}
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_LOCAL_PORT:-5679}/
      WEBHOOK_URL: http://localhost:${N8N_LOCAL_PORT:-5679}/
      GENERIC_TIMEZONE: Asia/Dhaka
      TZ: Asia/Dhaka
      N8N_DIAGNOSTICS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files:ro
    depends_on:
      earthdata-worker:
        condition: service_healthy
  earthdata-worker:
    build: ./earthdata-worker
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${WORKER_LOCAL_PORT:-8089}:8080"
    environment:
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
      EARTHDATA_USERNAME: ${EARTHDATA_USERNAME:-}
      EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD:-}
      OUTPUT_FILE: /data/lupus_cortex_2025_actual.csv
      WORK_DIR: /data/work
    volumes:
      - ./local-files:/data
      - ./earthdata-worker/config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health',timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
volumes:
  n8n_data:
