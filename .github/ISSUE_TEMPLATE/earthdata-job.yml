name: NASA Earthdata Downloader
description: Create a NASA Earthdata conversion job for Lupus Cortex
title: "[Earthdata Job] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Submit this form to start a GitHub Actions job that downloads, converts and combines NASA Earthdata into a training-ready CSV.

        **Do not paste your Earthdata token here.** The workflow reads the repository secret `EARTHDATA_TOKEN`.

  - type: textarea
    id: components
    attributes:
      label: Components
      description: One or more Lupus Cortex components, separated by commas or new lines.
      placeholder: |
        NO2
        O3
    validations:
      required: true

  - type: textarea
    id: collections
    attributes:
      label: NASA collection concept IDs
      description: NASA CMR collection concept IDs, one per line or comma-separated.
      placeholder: |
        C1234567890-PROVIDER
        C0987654321-PROVIDER
    validations:
      required: true

  - type: input
    id: south
    attributes:
      label: South latitude
      placeholder: "23.55"
    validations:
      required: true

  - type: input
    id: west
    attributes:
      label: West longitude
      placeholder: "90.20"
    validations:
      required: true

  - type: input
    id: north
    attributes:
      label: North latitude
      placeholder: "24.05"
    validations:
      required: true

  - type: input
    id: east
    attributes:
      label: East longitude
      placeholder: "90.65"
    validations:
      required: true

  - type: input
    id: start_date
    attributes:
      label: Start date
      description: YYYY-MM-DD
      placeholder: "2025-01-01"
    validations:
      required: true

  - type: input
    id: end_date
    attributes:
      label: End / due date
      description: YYYY-MM-DD
      placeholder: "2025-01-31"
    validations:
      required: true

  - type: dropdown
    id: fallback
    attributes:
      label: Closest-date fallback
      description: If the requested range has no granules, use the closest available date to the due date.
      options:
        - "Yes"
        - "No"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: strict
    attributes:
      label: Strict component filtering
      description: Remove unrelated variables/components from mixed collections.
      options:
        - "Yes"
        - "No"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: ground
    attributes:
      label: Include ground observations
      options:
        - "Yes"
        - "No"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: compact
    attributes:
      label: Compact training mode
      description: Aggregate spatial samples to reduce output size. Choose No for raw rows.
      options:
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: workers
    attributes:
      label: Parallel workers
      description: GitHub-hosted runners handle the heavy conversion. 8 is a safe default.
      options:
        - "4"
        - "8"
        - "12"
        - "16"
      default: 1
    validations:
      required: true

  - type: input
    id: output
    attributes:
      label: Output CSV filename
      value: lupus_cortex_training.csv
    validations:
      required: true
