name: Build Lupus Cortex 2025 Dataset

on:
  push:
    branches: [data-acquisition-2025]
    paths:
      - "scripts/collect_lupus_2025.py"
      - ".github/workflows/build-lupus-2025.yml"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-acquisition-2025

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data stack
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.1" pandas requests netCDF4 rasterio pystac-client planetary-computer pyproj

      - name: Collect and harmonize 2025 data
        run: python scripts/collect_lupus_2025.py

      - name: Remove intermediate monthly parts
        if: always()
        run: rm -f data_2025_output/part_*.csv.gz

      - name: Upload model-ready dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lupus-cortex-2025-dataset
          path: |
            data_2025_output/lupus_cortex_2025_master.csv.gz
            data_2025_output/lupus_cortex_2025_provenance.csv
            data_2025_output/acquisition_report.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
