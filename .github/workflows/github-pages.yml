name: Deploy Earthdata UI to GitHub Pages

on:
  push:
    branches: ["github-hosted"]
    paths:
      - "earthdata-downloader/github_site/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub-hosted branch
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: earthdata-downloader/github_site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
