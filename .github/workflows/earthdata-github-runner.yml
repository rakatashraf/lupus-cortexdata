name: Process Earthdata job

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  process:
    if: startsWith(github.event.issue.title, '[Earthdata Job]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      EARTHDATA_RUNTIME_PROFILE: persistent
      EARTHDATA_MAX_GRANULE_MB: "4096"
      EARTHDATA_MAX_ARCHIVE_MEMBER_MB: "2048"
      EARTHDATA_PRIMARY_READ_TIMEOUT_SECONDS: "120"
      EARTHDATA_RECOVERY_READ_TIMEOUT_SECONDS: "240"
      EARTHDATA_PRIMARY_GRANULE_BUDGET_SECONDS: "240"
      EARTHDATA_RECOVERY_GRANULE_BUDGET_SECONDS: "480"
    steps:
      - name: Checkout downloader
        uses: actions/checkout@v6
        with:
          ref: github-hosted

      - name: Install native scientific libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf4-alt-dev libhdf5-dev libnetcdf-dev libgdal-dev gdal-bin libjpeg-dev zlib1g-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: earthdata-downloader/requirements.txt

      - name: Install downloader dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r earthdata-downloader/requirements.txt

      - name: Run NASA conversion job
        working-directory: earthdata-downloader
        run: |
          python scripts/github_batch.py --event "$GITHUB_EVENT_PATH" --output-dir out

      - name: Upload CSV and audit report
        uses: actions/upload-artifact@v4
        with:
          name: earthdata-job-${{ github.event.issue.number }}
          path: |
            earthdata-downloader/out/*.csv
            earthdata-downloader/out/job_report.json
          if-no-files-found: error
          retention-days: 30

      - name: Comment completion
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "✅ Processing completed. Download the CSV from the workflow artifacts:\n\nhttps://github.com/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });

      - name: Comment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "❌ Processing failed. Open the workflow log for the exact granule/provider error:\n\nhttps://github.com/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId
            });
