name: Earthdata Downloader CI

on:
  push:
    branches:
      - earthdata-downloader-vercel
    paths:
      - "earthdata-downloader/**"
      - ".github/workflows/earthdata-downloader-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: earthdata-downloader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx requests pandas numpy xarray scipy h5netcdf h5py rasterio cftime

      - name: Compile downloader
        run: |
          python -m py_compile app/main.py app/convert.py app/cmr.py app/external.py

      - name: Validate browser JavaScript
        run: |
          node --check static/app.js

      - name: Exercise in-memory converters
        run: |
          python - <<'PY'
          import gzip
          import io
          import json
          import zipfile

          import h5py
          import numpy as np
          import pandas as pd
          import rasterio
          from rasterio.io import MemoryFile
          from rasterio.transform import from_origin

          from app.convert import combine_frames, convert_bytes

          bbox = {"south": 23.0, "west": 90.0, "north": 24.0, "east": 91.0}
          meta = {
              "source": "test",
              "component_query": "test",
              "collection_id": "C-TEST",
              "collection_title": "Test",
              "granule_id": "G-TEST",
              "granule_ur": "G-TEST",
              "satellite_platform": "TEST",
              "instrument": "TEST",
              "granule_begin": "2025-01-01T00:00:00Z",
              "granule_end": "2025-01-01T01:00:00Z",
              "original_file": "test",
              "download_url": "https://example.invalid/test",
          }

          csv_data = b"latitude,longitude,time,value\n23.5,90.5,2025-01-01T00:00:00Z,10\n"
          frames = convert_bytes(csv_data, "sample.csv", meta, [], bbox, 0)
          assert frames and len(frames[0]) == 1

          gz_data = gzip.compress(csv_data)
          frames = convert_bytes(gz_data, "sample.csv.gz", meta, [], bbox, 0)
          assert frames and len(frames[0]) == 1

          zbuf = io.BytesIO()
          with zipfile.ZipFile(zbuf, "w", zipfile.ZIP_DEFLATED) as z:
              z.writestr("inside.csv", csv_data)
          frames = convert_bytes(zbuf.getvalue(), "sample.zip", meta, [], bbox, 0)
          assert frames and len(frames[0]) == 1

          import xarray as xr

          bad_time_ds = xr.Dataset(
              data_vars={
                  "AOD": (("Time", "latitude", "longitude"), np.array([[[1.25]]])),
              },
              coords={
                  "Time": ("Time", np.array([2025.0])),
                  "latitude": ("latitude", np.array([23.75])),
                  "longitude": ("longitude", np.array([90.375])),
              },
          )
          bad_time_ds["Time"].attrs["units"] = "years since 0000-01-01 00:00:00"
          bad_time_ds["Time"].attrs["calendar"] = "gregorian"
          bad_nc = bad_time_ds.to_netcdf(engine="scipy")
          bad_frames = convert_bytes(bad_nc, "MSAQS02L4.2-test.nc", meta, ["AOD"], bbox, 0)
          assert bad_frames
          assert "source_temporal_raw_value" in bad_frames[0].columns
          assert bad_frames[0]["source_temporal_units"].iloc[0].startswith("years since 0000")

          swathbuf = io.BytesIO()
          with h5py.File(swathbuf, "w") as h:
              geo = h.create_group("HDFEOS/SWATHS/ColumnAmountNO2/Geolocation Fields")
              fields = h.create_group("HDFEOS/SWATHS/ColumnAmountNO2/Data Fields")
              lat = np.array([[22.0, 23.7, 23.8], [24.2, 23.9, 25.0]], dtype="float32")
              lon = np.array([[89.0, 90.35, 90.45], [90.4, 90.5, 92.0]], dtype="float32")
              geo.create_dataset("Latitude", data=lat)
              geo.create_dataset("Longitude", data=lon)
              t = geo.create_dataset("Time", data=np.array([1000.0, 1010.0]))
              t.attrs["Units"] = "seconds since 1993-01-01 00:00:00"
              d = fields.create_dataset(
                  "ColumnAmountNO2Trop",
                  data=np.array([[1, 2, 3], [4, 5, 6]], dtype="float32"),
              )
              d.attrs["Units"] = "molec/cm2"
              d.attrs["ScaleFactor"] = np.array([1.0], dtype="float32")
              d.attrs["Offset"] = np.array([0.0], dtype="float32")
          swath_bbox = {"south": 23.65, "west": 90.30, "north": 23.95, "east": 90.55}
          swath_frames = convert_bytes(
              swathbuf.getvalue(),
              "OMI-Aura_L2-OMNO2_test.he5",
              meta,
              ["ColumnAmountNO2Trop"],
              swath_bbox,
              0,
          )
          assert swath_frames
          assert len(swath_frames[0]) == 3
          assert swath_frames[0]["latitude"].between(23.65, 23.95).all()
          assert swath_frames[0]["longitude"].between(90.30, 90.55).all()
          assert set(np.round(swath_frames[0]["value"].astype(float), 6)) == {2.0, 3.0, 5.0}

          eosbuf = io.BytesIO()
          with h5py.File(eosbuf, "w") as h:
              fields = h.create_group("HDFEOS/GRIDS/ColumnAmountNO2/Data Fields")
              d = fields.create_dataset(
                  "ColumnAmountNO2Trop",
                  data=np.ones((720, 1440), dtype="float32") * 2.5e15,
              )
              d.attrs["Units"] = np.array([b"molec/cm2"])
              d.attrs["ScaleFactor"] = np.array([1.0], dtype="float32")
              d.attrs["Offset"] = np.array([0.0], dtype="float32")
              d.attrs["_FillValue"] = np.array([-1.2676506e30], dtype="float32")
          eos_bbox = {"south": 23.5, "west": 90.0, "north": 24.0, "east": 90.5}
          frames = convert_bytes(
              eosbuf.getvalue(),
              "OMI-Aura_L3-OMNO2d_2025m0101_v004-test.he5",
              meta,
              ["ColumnAmountNO2Trop"],
              eos_bbox,
              0,
          )
          assert frames and len(frames[0]) == 4
          assert frames[0]["latitude"].between(23.5, 24.0).all()
          assert frames[0]["longitude"].between(90.0, 90.5).all()
          assert np.isclose(frames[0]["value"].iloc[0], 2.5e15)

          hbuf = io.BytesIO()
          with h5py.File(hbuf, "w") as h:
              h.create_dataset("latitude", data=np.array([[23.4, 23.6]]))
              h.create_dataset("longitude", data=np.array([[90.4, 90.6]]))
              d = h.create_dataset("NO2", data=np.array([[1.0, 2.0]]))
              d.attrs["units"] = "mol/m2"
          frames = convert_bytes(hbuf.getvalue(), "sample.h5", meta, ["NO2"], bbox, 0)
          assert frames and len(frames[0]) == 2

          profile = {
              "driver": "GTiff",
              "height": 2,
              "width": 2,
              "count": 1,
              "dtype": "float32",
              "crs": "EPSG:4326",
              "transform": from_origin(90.0, 24.0, 0.5, 0.5),
          }
          with MemoryFile() as mem:
              with mem.open(**profile) as dst:
                  dst.write(np.array([[1, 2], [3, 4]], dtype="float32"), 1)
              tif_data = mem.read()
          frames = convert_bytes(tif_data, "sample.tif", meta, [], bbox, 0)
          assert frames

          combined = combine_frames(frames)
          assert "data_timestamp_utc" in combined.columns
          assert "data_cycle" in combined.columns

          # Heterogeneous frames must normalize to a fixed multi-collection schema.
          mixed_a = pd.DataFrame([{"variable":"A","value":1,"custom_a":"x"}])
          mixed_b = pd.DataFrame([{"variable":"B","value":2,"custom_b":"y"}])
          mixed = combine_frames([mixed_a, mixed_b])
          assert "extra_attributes_json" in mixed.columns
          assert "custom_a" not in mixed.columns
          assert "custom_b" not in mixed.columns
          assert list(mixed.columns) == list(combine_frames([mixed_b]).columns)

          required = {
              "component_segment",
              "collection_segment_key",
              "collection_short_name",
              "collection_version",
              "source_satellite",
              "data_timestamp_utc",
              "data_date_utc",
              "data_time_utc",
              "data_cycle",
              "latitude",
              "longitude",
              "coordinate_status",
              "variable",
              "value",
              "unit",
              "weight",
              "weight_unit",
              "weight_variable",
          }
          assert required.issubset(set(mixed.columns))

          weighted = pd.DataFrame([
              {
                  "component_names":"NO2",
                  "component_primary":"NO2",
                  "collection_id":"C1",
                  "collection_short_name":"OMNO2d",
                  "collection_version":"004",
                  "granule_id":"G1",
                  "data_timestamp_utc":"2025-01-01T00:00:00Z",
                  "latitude":23.75,
                  "longitude":90.375,
                  "variable":"ColumnAmountNO2Trop",
                  "value":2.0,
                  "unit":"molec/cm2",
              },
              {
                  "component_names":"NO2",
                  "component_primary":"NO2",
                  "collection_id":"C1",
                  "collection_short_name":"OMNO2d",
                  "collection_version":"004",
                  "granule_id":"G1",
                  "data_timestamp_utc":"2025-01-01T00:00:00Z",
                  "latitude":23.75,
                  "longitude":90.375,
                  "variable":"Weight",
                  "value":0.75,
                  "unit":"1",
              },
          ])
          weighted_out = combine_frames([weighted])
          science = weighted_out[weighted_out["variable"] == "ColumnAmountNO2Trop"].iloc[0]
          assert np.isclose(float(science["weight"]), 0.75)
          assert science["weight_variable"] == "Weight"

          print("IN_MEMORY_CONVERSION_TESTS_OK")
          PY
